name: FinderForge
options:
  bundleIdPrefix: com.devsun
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    DEVELOPMENT_TEAM: CAQ5292WML
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES

targets:
  FinderForge:
    type: application
    platform: macOS
    sources:
      - path: FinderForge
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.devsun.FinderForge
        PRODUCT_NAME: FinderForge
        INFOPLIST_FILE: FinderForge/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: FinderForge/FinderForge.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
    dependencies:
      - target: FinderMenuExtension
        embed: true

  FinderMenuExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: FinderMenuExtension
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.devsun.FinderForge.FinderMenuExtension
        PRODUCT_NAME: FinderMenuExtension
        INFOPLIST_FILE: FinderMenuExtension/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: FinderMenuExtension/FinderMenuExtension.entitlements
    dependencies:
      - sdk: FinderSync.framework
